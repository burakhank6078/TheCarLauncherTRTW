plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thecarlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.thecarlauncher'
        minSdk 21
        targetSdk 34
        versionCode 66
        versionName '4.5.0'
    }

    signingConfigs {
        // CI passes its own key through the environment (GitHub secrets, see the workflow). Without it, a local build or a
        // fork signs with the key kept in keystore/, so every build still installs as an update over the one built with the same key.
        release {
            def envStore = System.getenv('SIGNING_STORE_FILE')
            if (envStore) {
                storeFile file(envStore)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            } else {
                storeFile rootProject.file('keystore/release.jks')
                storePassword 'carlauncher'
                keyAlias 'carlauncher'
                keyPassword 'carlauncher'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        // Plain JVM tests for the pure logic (frame decoding, BLE framing); Android calls return defaults.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Offline maps (mapsforge, LGPL-3.0) and its SVG helper (Apache-2.0); see NOTICE.
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
}
